<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🤘 Şebnem Ferah Konser Operasyonu 🎸 </title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000000; 
            /* EMOJİLERİ ARKA PLANA DESEN OLARAK EKLEDİK */
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='40' font-size='20' opacity='0.2'%3E🤘%3C/text%3E%3Ctext x='40' y='70' font-size='20' opacity='0.2'%3E🎸%3C/text%3E%3Ctext x='50' y='30' font-size='20' opacity='0.2'%3E♫%3C/text%3E%3C/svg%3E"), 
                              radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 20, 0.98); 
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            max-width: 480px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
            z-index: 2; /* İçeriğin arka planın önünde kalması için */
        }

        h1 {
            font-size: 22px;
            min-height: 90px;
            margin: 15px 0;
            line-height: 1.4;
            color: #eeeeee;
        }

        img {
            width: 100%;
            max-width: 280px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        .buttons {
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 85%;
        }

        #yesBtn {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        #noBtn {
            background-color: #222;
            color: #888;
            font-size: 14px;
        }

        #yesBtn:hover {
            transform: scale(1.05);
            background-color: #dddddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="question">Selam Melike, duyduğuma göre Şebnem Ferah sahnelere dönüyormuş... Beraber gitmeye ne dersin? 🤘🎸</h1>
    <img id="anaGorsel" src="number1.gif">
    
    <div class="buttons">
        <button id="yesBtn" onclick="evet()">Kesinlikle gidelim!</button>
        <button id="noBtn" onclick="hayirBasildi()">Emin olamadım...</button>
    </div>
</div>

<script>
    const gifListesi = ["number1.gif", "number2.gif", "number3.gif", "number4.gif", "number5.gif"];
    
    gifListesi.forEach(gif => {
        const img = new Image();
        img.src = gif;
    });

    let hamle = 0;
    let butonBoyutu = 1;
    let onaylandi = false;

 function evet() {
        if (!onaylandi) {
            document.getElementById('question').innerHTML = "Harika! Biletler satışa çıktığı an operasyonu başlatıyorum. O gün beraberiz!";
            document.getElementById('anaGorsel').src = "number5.gif";
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('yesBtn').innerHTML = "Planı konuşalım! 💬";
            document.getElementById('yesBtn').style.transform = "scale(1)";
            onaylandi = true;
        } else {
            // WHATSAPP YÖNLENDİRMESİ
            // Telefon numaranı ülke koduyla beraber yaz (Örn: 905xxxxxxxxx)
            const telefonNumaram = "905071265840"; 
            const mesaj = "Selam! Şebnem Ferah konseri için geldim, operasyon planını konuşalım mı? 😊";
            const whatsappUrl = "https://wa.me/" + telefonNumaram + "?text=" + encodeURIComponent(mesaj);
            
            window.location.href = whatsappUrl;
        }
    }

    function hayirBasildi() {
        hamle++;
        const evetButon = document.getElementById('yesBtn');
        const baslik = document.getElementById('question');
        const resim = document.getElementById('anaGorsel');

        butonBoyutu += 0.3;
        evetButon.style.transform = "scale(" + butonBoyutu + ")";

        if (hamle === 1) {
            baslik.innerHTML = "Şebnem Ferah'ı canlı dinleyip şarkılara eşlik etmeyecek miyiz yani? Bence çok eğlenceli olur, kaçırmayalım.";
            resim.src = "number2.gif";
            document.getElementById('noBtn').innerHTML = "Ya bilet alamazsak?";
        } 
        else if (hamle === 2) {
            baslik.innerHTML = "B planımız hazır Maçka Parkı! Sandalyelerimizi atar, konseri dışarıdan dinleriz.";
            resim.src = "number3.gif";
            document.getElementById('noBtn').innerHTML = "Denemeye değer mi? :)";
        }
        else if (hamle >= 3) {
            baslik.innerHTML = "Bilet olsun ya da olmasın, o akşam Maçka'da veya içerde Şebnem Ferah'a eşlik ediyoruz. Kaçışın yok!";
            resim.src = "number4.gif";
            document.getElementById('noBtn').style.display = 'none';
        }
    }
</script>

</body>
</html>
